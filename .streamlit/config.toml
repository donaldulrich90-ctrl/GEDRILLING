[browser]
gatherUsageStats = false

[runner]
# Rerun plus réactif après interaction (Streamlit récent)
fastReruns = true

[theme]
base = "dark"
primaryColor = "#F5B800"
backgroundColor = "#071A14"
secondaryBackgroundColor = "#0D2A20"
textColor = "#F3F6F2"
font = "sans serif"

[server]
# Évite des blocages derrière certains reverse-proxy (NPM / OpenResty)
enableXsrfProtection = false
